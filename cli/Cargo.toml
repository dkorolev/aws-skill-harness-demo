[package]
name = "awsw"
version = "2.0.0"
edition = "2024"
description = "Dependency-light AWS inventory client with manual payloads and SigV4"
license = "MIT"

[dependencies]
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
clap = { version = "4", features = ["derive"] }
hex = "0.4"
hmac = "0.12"
percent-encoding = "2"
quick-xml = { version = "0.38", features = ["serialize"] }
rayon = "1"
reqwest = { version = "0.12", default-features = false, features = ["blocking", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
thiserror = "2"
zeroize = "1"

[dev-dependencies]
tempfile = "3"
